name: Build and release Windows app

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Scan for committed secrets
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/gitleaks/gitleaks/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "_windows_x64\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "No Windows x64 Gitleaks asset was found." }
          Invoke-WebRequest $asset.browser_download_url -OutFile gitleaks.zip
          Expand-Archive gitleaks.zip -DestinationPath gitleaks -Force
          & .\gitleaks\gitleaks.exe detect --source . --redact --no-banner

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:win
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
